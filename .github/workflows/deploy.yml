# INFRA-1: AWS デプロイ自動化（GitHub Actions + OIDC）
# このワークフローは手動トリガー (workflow_dispatch) で実行
# backend/frontend イメージをビルド→ECR プッシュ→ECS タスク定義更新

name: Deploy to AWS

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - staging
          - prod
      backend_image_tag:
        description: 'Backend image tag (default: git SHA)'
        required: false
        type: string
      frontend_image_tag:
        description: 'Frontend image tag (default: git SHA)'
        required: false
        type: string

env:
  AWS_REGION: ap-northeast-1

permissions:
  contents: read
  id-token: write

jobs:
  build-and-deploy:
    name: Build and Deploy to ${{ inputs.environment }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::620629391048:role/smartwater-guardian-github-deploy-role
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Pre-flight checks
        run: |
          set -e
          echo "Checking required configuration..."
          if [ -z "${{ secrets.ALB_DNS_NAME }}" ]; then
            echo "WARNING: ALB_DNS_NAME secret is not configured (optional for dev)" >&2
          fi
          echo "✓ AWS Account: 620629391048"
          echo "✓ IAM Role: smartwater-guardian-github-deploy-role"
          echo "✓ Pre-flight checks passed"

      - name: Set image tags
        id: tags
        run: |
          set -e
          BACKEND_TAG=${{ inputs.backend_image_tag || github.sha }}
          FRONTEND_TAG=${{ inputs.frontend_image_tag || github.sha }}

          echo "backend_tag=${BACKEND_TAG}" >> $GITHUB_OUTPUT
          echo "frontend_tag=${FRONTEND_TAG}" >> $GITHUB_OUTPUT
          echo "backend_image=${{ steps.login-ecr.outputs.registry }}/smartwater-guardian-backend:${BACKEND_TAG}" >> $GITHUB_OUTPUT
          echo "frontend_image=${{ steps.login-ecr.outputs.registry }}/smartwater-guardian-frontend:${FRONTEND_TAG}" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./backend/Dockerfile
          push: true
          tags: ${{ steps.tags.outputs.backend_image }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push frontend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./frontend/Dockerfile
          push: true
          build-args: |
            NEXT_PUBLIC_API_BASE_URL=http://${{ secrets.ALB_DNS_NAME }}
          tags: ${{ steps.tags.outputs.frontend_image }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Update ECS task definitions and services
        run: |
          set -e
          # Note: ECS cluster/services use fixed resource names (defined in 06-ecs.yaml), not environment-specific
          CLUSTER="smartwater-guardian-cluster"
          BACKEND_TASK_DEF="smartwater-guardian-backend"
          FRONTEND_TASK_DEF="smartwater-guardian-frontend"
          BACKEND_SERVICE="smartwater-guardian-backend-service"
          FRONTEND_SERVICE="smartwater-guardian-frontend-service"

          BACKEND_IMAGE=${{ steps.tags.outputs.backend_image }}
          FRONTEND_IMAGE=${{ steps.tags.outputs.frontend_image }}
          REGION=${{ env.AWS_REGION }}

          echo "Updating task definitions for cluster: $CLUSTER"

          # backend タスク定義更新
          echo "Processing backend task definition..."
          aws ecs describe-task-definition \
            --task-definition $BACKEND_TASK_DEF \
            --region $REGION \
            --query 'taskDefinition' | \
            jq "(.containerDefinitions[] | select(.name == \"backend\")).image = \"${BACKEND_IMAGE}\" | \
                del(.taskDefinitionArn, .revision, .status, .requiresAttributes, .compatibilities, .registeredAt, .registeredBy)" \
            > backend-taskdef.json

          if [ ! -s backend-taskdef.json ]; then
            echo "ERROR: Failed to process backend task definition" >&2
            exit 1
          fi

          BACKEND_REVISION=$(aws ecs register-task-definition \
            --cli-input-json file://backend-taskdef.json \
            --region $REGION \
            --query 'taskDefinition.revision' \
            --output text)

          if [ -z "$BACKEND_REVISION" ]; then
            echo "ERROR: Failed to register backend task definition" >&2
            exit 1
          fi

          echo "✓ Backend task definition registered: revision $BACKEND_REVISION"

          # frontend タスク定義更新
          echo "Processing frontend task definition..."
          aws ecs describe-task-definition \
            --task-definition $FRONTEND_TASK_DEF \
            --region $REGION \
            --query 'taskDefinition' | \
            jq "(.containerDefinitions[] | select(.name == \"frontend\")).image = \"${FRONTEND_IMAGE}\" | \
                del(.taskDefinitionArn, .revision, .status, .requiresAttributes, .compatibilities, .registeredAt, .registeredBy)" \
            > frontend-taskdef.json

          if [ ! -s frontend-taskdef.json ]; then
            echo "ERROR: Failed to process frontend task definition" >&2
            exit 1
          fi

          FRONTEND_REVISION=$(aws ecs register-task-definition \
            --cli-input-json file://frontend-taskdef.json \
            --region $REGION \
            --query 'taskDefinition.revision' \
            --output text)

          if [ -z "$FRONTEND_REVISION" ]; then
            echo "ERROR: Failed to register frontend task definition" >&2
            exit 1
          fi

          echo "✓ Frontend task definition registered: revision $FRONTEND_REVISION"

          # ECS サービス更新（新しいタスク定義を使用）
          echo "Updating backend service..."
          aws ecs update-service \
            --cluster $CLUSTER \
            --service $BACKEND_SERVICE \
            --task-definition ${BACKEND_TASK_DEF}:${BACKEND_REVISION} \
            --force-new-deployment \
            --region $REGION

          echo "Updating frontend service..."
          aws ecs update-service \
            --cluster $CLUSTER \
            --service $FRONTEND_SERVICE \
            --task-definition ${FRONTEND_TASK_DEF}:${FRONTEND_REVISION} \
            --force-new-deployment \
            --region $REGION

          echo "✓ Services updated successfully"

      - name: Wait for ECS deployments
        run: |
          set -e
          CLUSTER="smartwater-guardian-cluster"
          REGION=${{ env.AWS_REGION }}
          MAX_WAIT_MINUTES=15

          for service in smartwater-guardian-backend-service smartwater-guardian-frontend-service; do
            echo "Waiting for $service to stabilize (max ${MAX_WAIT_MINUTES} minutes)..."

            timeout $((MAX_WAIT_MINUTES * 60)) bash -c \
              "aws ecs wait services-stable \
                --cluster $CLUSTER \
                --services $service \
                --region $REGION" || {
              echo "ERROR: Service $service did not stabilize within ${MAX_WAIT_MINUTES} minutes" >&2
              echo "Checking service status..."
              aws ecs describe-services \
                --cluster $CLUSTER \
                --services $service \
                --region $REGION | jq '.services[0] | {status, deployments, events: .events[0:3]}'
              exit 1
            }

            echo "✓ $service is stable"
          done

          echo "✓ All services deployed successfully"

      - name: Deployment summary
        if: success()
        run: |
          set -e
          CLUSTER="smartwater-guardian-cluster"
          REGION=${{ env.AWS_REGION }}

          echo "## ✓ Deployment Completed Successfully" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Deployment Details" >> $GITHUB_STEP_SUMMARY
          echo "- **Environment**: \`${{ inputs.environment }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Backend Image**: \`${{ steps.tags.outputs.backend_image }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Frontend Image**: \`${{ steps.tags.outputs.frontend_image }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Region**: \`$REGION\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Cluster**: \`$CLUSTER\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Timestamp**: \`$(date -u +'%Y-%m-%dT%H:%M:%SZ')\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Running Services" >> $GITHUB_STEP_SUMMARY

          for service in smartwater-guardian-backend-service smartwater-guardian-frontend-service; do
            STATUS=$(aws ecs describe-services \
              --cluster $CLUSTER \
              --services $service \
              --region $REGION \
              --query 'services[0].status' \
              --output text)
            RUNNING=$(aws ecs describe-services \
              --cluster $CLUSTER \
              --services $service \
              --region $REGION \
              --query 'services[0].runningCount' \
              --output text)
            echo "- **$service**: Status=\`$STATUS\`, Running Tasks=\`$RUNNING\`" >> $GITHUB_STEP_SUMMARY
          done

      - name: Deployment failure diagnostics
        if: failure()
        run: |
          CLUSTER="smartwater-guardian-cluster"
          REGION=${{ env.AWS_REGION }}

          echo "## ✗ Deployment Failed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Troubleshooting Steps" >> $GITHUB_STEP_SUMMARY
          echo "1. Check AWS credentials and permissions (OIDC role: smartwater-guardian-github-deploy-role)" >> $GITHUB_STEP_SUMMARY
          echo "2. Verify ECS cluster exists: \`$CLUSTER\`" >> $GITHUB_STEP_SUMMARY
          echo "3. Verify services exist: \`smartwater-guardian-backend-service\`, \`smartwater-guardian-frontend-service\`" >> $GITHUB_STEP_SUMMARY
          echo "4. Verify task definitions are registered: \`smartwater-guardian-backend\`, \`smartwater-guardian-frontend\`" >> $GITHUB_STEP_SUMMARY
          echo "5. Check CloudWatch logs:" >> $GITHUB_STEP_SUMMARY
          echo "   - \`aws logs tail /ecs/smartwater-guardian-backend --follow --region $REGION\`" >> $GITHUB_STEP_SUMMARY
          echo "   - \`aws logs tail /ecs/smartwater-guardian-frontend --follow --region $REGION\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Debug Information" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "Cluster: $CLUSTER" >> $GITHUB_STEP_SUMMARY
          echo "Region: $REGION" >> $GITHUB_STEP_SUMMARY
          echo "Timestamp: $(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
