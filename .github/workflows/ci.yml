name: CI Workflow

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # --- バックエンドの自動テスト & カバレッジ測定 ---
  backend-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest pytest-cov httpx

      - name: Verify Backend Routes & Imports
        run: |
          cd backend
          python -c "import main; print([r.path for r in main.app.routes if hasattr(r, 'path')])"

      - name: Run Telemetry Verification Script
        run: |
          cd backend
          # テスト用のバックエンドサーバーをバックグラウンド起動
          python -m uvicorn main:app --port 8000 &
          # 起動待ち (3秒)
          sleep 3
          # 検証スクリプト実行
          python scripts/check_telemetry.py

      - name: Run Pytest with Coverage
        run: |
          cd backend
          python -m pytest --cov=app --cov-report=term-missing --cov-report=xml

      - name: Upload Backend Coverage Artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage-report
          path: backend/coverage.xml

  # --- フロントエンドの自動テスト & カバレッジ測定 ---
  frontend-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        run: |
          cd frontend
          npm ci

      - name: Run ESLint
        run: |
          cd frontend
          npm run lint

      - name: Run Vitest Tests with Coverage
        run: |
          cd frontend
          npm run test -- --run --coverage

      - name: Upload Frontend Coverage Artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage-report
          path: frontend/coverage/

      - name: Build Next.js App
        run: |
          cd frontend
          npm run build
        env:
          NEXT_PUBLIC_API_BASE_URL: "http://localhost:8000"