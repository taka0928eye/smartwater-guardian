name: CI Workflow

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # --- バックエンドの自動テスト ---
  backend-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Verify Backend Routes & Imports
        run: |
          cd backend
          python -c "import main; print([r.path for r in main.app.routes])"

      - name: Run Telemetry Verification Script
        run: |
          cd backend
          # テスト用のバックエンドサーバーをバックグラウンド起動
          python -m uvicorn main:app --port 8000 &
          # 起動待ち (3秒)
          sleep 3
          # 検証スクリプト実行
          python scripts/check_telemetry.py

  # --- フロントエンドの自動テスト ---
  frontend-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        run: |
          cd frontend
          npm ci

      - name: Run ESLint
        run: |
          cd frontend
          npm run lint

      - name: Run Vitest Tests
        run: |
          cd frontend
          npm run test -- --run

      - name: Build Next.js App
        run: |
          cd frontend
          npm run build
        env:
          NEXT_PUBLIC_API_BASE_URL: "http://localhost:8000"