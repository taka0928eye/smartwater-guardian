name: CI Workflow

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # --- バックエンドの自動テスト & カバレッジ測定 ---
  backend-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install -r backend/requirements-dev.txt

      - name: Verify Backend Routes & Imports
        run: |
          cd backend
          python -c "import main; print([r.path for r in main.app.routes if hasattr(r, 'path')])"

      - name: Run Ruff Lint (Q6: C)
        run: |
          cd backend
          ruff check app main.py scripts

      - name: Run Mypy Type Check (Q6: C)
        run: |
          cd backend
          mypy app main.py --ignore-missing-imports

      - name: Run Telemetry Verification Script
        run: |
          cd backend
          # テスト用のバックエンドサーバーをバックグラウンド起動
          python -m uvicorn main:app --port 8000 &
          # 起動待ち (3秒)
          sleep 3
          # 検証スクリプト実行
          python scripts/check_telemetry.py

      - name: Run Pytest with Coverage (Q4: B)
        run: |
          cd backend
          # 行 + branch 各 80%（Q4: B 確定）。requirements-dev.txt の pytest-cov を使用。
          python -m pytest --cov=app --cov-branch --cov-report=term-missing --cov-report=xml --cov-fail-under=80

      - name: Upload Backend Coverage Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage-report
          path: backend/coverage.xml

  # --- フロントエンドの自動テスト & カバレッジ測定 ---
  frontend-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        run: |
          cd frontend
          npm ci

      - name: Run ESLint
        run: |
          cd frontend
          npm run lint

      - name: Run Vitest Tests with Coverage
        run: |
          cd frontend
          # thresholds（4 指標 80%）の単一ソースは vitest.config.mts。
          # ローカル npm run test と同一のコマンドでゲートを一致させる（NFR-1 / team-practices Q3=A）。
          npm run test

      - name: Upload Frontend Coverage Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage-report
          path: frontend/coverage/

      - name: Build Next.js App
        run: |
          cd frontend
          npm run build
        env:
          NEXT_PUBLIC_API_BASE_URL: "http://localhost:8000"